# TEMPLATE ONLY: replace hostname, paths and certificate files before enabling.
# Required modules: ssl, headers, reqtimeout. Use a dedicated virtual host.
<VirtualHost *:80>
    ServerName quizhell.example
    Redirect permanent / https://quizhell.example/
</VirtualHost>

<VirtualHost *:443>
    ServerName quizhell.example
    DocumentRoot "C:/laragon/www/QuizHell/public"
    SSLEngine on
    SSLCertificateFile "C:/certificates/quizhell/fullchain.pem"
    SSLCertificateKeyFile "C:/certificates/quizhell/privkey.pem"
    SetEnv QUIZHELL_ENV production
    # Set database credentials outside this checked-in template.
    # If using a reverse proxy, accept its scheme/client IP only from its
    # explicitly trusted address and prevent direct public backend access.
    <Directory "C:/laragon/www/QuizHell/public">
        Options -Indexes
        AllowOverride None
        Require all granted
        LimitRequestBody 1048576
    </Directory>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    # %U excludes query strings. Do not add %r, %q, Referer, Cookie or Authorization.
    LogFormat "%a %t \"%m %U %H\" %>s %b" quizhell_safe
    CustomLog "logs/quizhell-access.log" quizhell_safe
    ErrorLog "logs/quizhell-error.log"
</VirtualHost>
